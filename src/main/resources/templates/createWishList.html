<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opret ønskeseddel</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header>
    <h2><a th:href="@{/}" class="logo">Ønskeskyen ☁️</a></h2>

    <nav>
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>

</header>

<main>
    <h1 class="overskriftWishlist">Opret ønskeseddel</h1>

    <div class="wishlist-form">
        <form th:action="@{/saveCreateWishList}"
              method="post"
              class="wishlist-form"
              novalidate>

            <label for="title">Titel på ønskeseddel</label>

            <input type="text"
                   id="title"
                   name="title"
                   maxlength="150"
                   placeholder="F.eks. Mine fødselsdagsønsker" required>

            <button class="button3" type="submit">Gem ønskeseddel</button>

        </form>
    </div>

</main>

</body>
</html>

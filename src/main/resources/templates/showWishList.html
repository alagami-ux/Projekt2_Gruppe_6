<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ønskeseddel</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h2><a th:href="@{/}" class="logo">Ønskeskyen ☁️</a></h2>

    <nav>
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>
</header>

<main>
    <p th:if="${errorMessage != null}"
       th:text="${errorMessage}"
       class="error-message"
       role="alert"></p>
    <div>
        <div class="wishlist-title-row">
            <h1 th:text="${wishlist.title}">Ønskesedlens titel</h1>

            <a th:href="@{/getUpdateWishList(id=${wishlist.id})}"
               class="btn">
                Rediger ønskeseddel
            </a>
        </div>

        <div>
            <a th:href="@{/getCreateWish(id=${wishlist.id})}" class="addWish">
                + Tilføj et ønske
            </a>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(wishes)}">
        Du har endnu ikke tilføjet nogen ønsker.
    </p>

    <div>
        <article th:each="wish : ${wishes}">

            <img class="wish-image"
                 th:src="${#strings.isEmpty(wish.imageUrl)
         ? '/images/standard.svg'
         : wish.imageUrl}"
                 th:alt="${#strings.isEmpty(wish.imageUrl)
         ? 'Intet produktbillede'
         : wish.name}"
                 th:attr="data-fallback=@{/images/standard.svg}"
                 onerror="this.onerror=null; this.src=this.dataset.fallback;">

            <div class="wish-details">

                <div class="wish-title-row">
                    <h2 th:text="${wish.name}">Ønskets navn</h2>

                    <div class="wish-actions">
                        <a th:href="@{/getUpdateWish(id=${wish.id})}" class="btn">
                            Rediger ønske
                        </a>

                        <form th:action="@{/confirmDeleteWish}" method="get">
                            <input type="hidden" name="id" th:value="${wish.id}">
                            <input type="hidden" name="wishlistId" th:value="${wishlist.id}">
                            <button type="submit" class="btn btn-danger">Slet</button>
                        </form>
                    </div>
                </div>

                <p th:if="${!#strings.isEmpty(wish.description)}"
                   th:text="${wish.description}">
                    Beskrivelse
                </p>

                <p>
                    Antal: <span th:text="${wish.quantity}">1</span>
                </p>

                <div th:if="${wish.price != null}">
                    <p>
                        Pris pr. stk.:
                        <span th:text="${wish.price}">79.50</span> kr.
                    </p>

                    <p>
                        <strong>
                            Totalpris:
                            <span th:text="${wish.price * wish.quantity}">159.00</span> kr.
                        </strong>
                    </p>
                </div>

                <a class="btn"
                   th:if="${!#strings.isEmpty(wish.productUrl)}"
                   th:href="${wish.productUrl}">
                    Se produkt
                </a>

            </div>
        </article>
    </div>
</main>

<footer>
    <p>ØNSKESKYEN · 2026</p>
</footer>

</body>
</html>

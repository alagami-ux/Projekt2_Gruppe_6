
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bekræft sletning</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h2>
        <a th:href="@{/}" class="logo">Ønskeskyen ☁️</a>
    </h2>

    <nav>
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>
</header>

<main>
    <div class="delete-confirmation">

        <h1>Bekræft sletning</h1>

        <p>
            Er du sikker på, at du vil slette ønskesedlen
            <strong th:text="${wishlist.title}">Ønskeseddel</strong>?
        </p>

        <div class="delete-actions">

            <form th:action="@{/deleteWishList}" method="post">
                <input type="hidden"
                       name="id"
                       th:value="${wishlist.id}">

                <button type="submit" class="btn btn-danger">
                    Ja, slet ønskesedlen
                </button>
            </form>

            <a th:href="@{/wishlists}" class="btn">
                Annuller
            </a>

        </div>
    </div>
</main>


<footer>
    <p>ØNSKESKYEN · 2026</p>
</footer>

</body>
</html>

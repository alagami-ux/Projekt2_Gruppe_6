<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ønskeskyen</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h2>
        <a th:href="@{/}" class="logo">Ønskeskyen ☁️</a>
    </h2>

    <nav aria-label="Hovednavigation">
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>
</header>

<main>
    <section>
        <img class="img-forside"
             th:src="@{/images/forside-gaver.jpg}"
             alt="Gaver med gavebånd og blomster">

        <h1>Alle dine ønsker samlet ét sted</h1>

        <p>
            Saml dine ønsker, lav personlige ønskesedler,
            og hold styr på de ting, du drømmer om.
        </p>

        <div class="button">
            <form th:action="@{/getCreateWishList}"
                  method="get"
                  class="modify-form">
                <button class="btn" type="submit">
                    + Opret en ny ønskeseddel
                </button>
            </form>
        </div>

        <div class="button2">
            <form th:action="@{/wishlists}"
                  method="get"
                  class="modify-form">
                <button class="btn" type="submit">
                    Se mine ønskesedler
                </button>
            </form>
        </div>
    </section>

    <hr>

    <section>
        <h2>Gør dine ønsker personlige</h2>

        <div class="grid">
            <a class="box1 feature-link" th:href="@{/getCreateWishList}">
                <p>Saml dine ønsker</p>
                <p>Alle dine idéer på ét sted</p>
            </a>

            <a class="box2 feature-link" th:href="@{/wishlists}">
                <p>Hold overblik</p>
                <p>Organisér dine ønskesedler</p>
            </a>
        </div>
    </section>
</main>

<footer>
    <p>ØNSKESKYEN · 2026</p>
</footer>

</body>
</html>

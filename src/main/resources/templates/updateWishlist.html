<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret ønskeseddel</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header>
    <h2><a th:href="@{/}" class="logo">Ønskeskyen ☁️</a></h2>

    <nav>
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>
</header>

<main>
    <h1 class="overskriftWishlist">Rediger ønskeseddel</h1>

    <div class="wishlist-form">
        <form th:action="@{/saveUpdateWishList}"
              method="post"
              th:object="${wishList}"
              class="wishlist-form"
              novalidate>

            <input type="hidden" th:field="*{id}">


            <label for="title">Rediger titlen på ønskeseddel</label>

            <input type="text" id="title" th:field="*{title}" maxlength="150" required>

            <div th:if="${#fields.hasErrors('title')}" class="error-message">
                <span th:errors="*{title}">Fejl</span>
            </div>

            <div th:if="${errorMessage != null}" class="error-message" th:text="${errorMessage}">
                Fejl
            </div>

            <button class="button3" type="submit">Gem ændringer</button>

        </form>
    </div>
</main>

</body>
</html>

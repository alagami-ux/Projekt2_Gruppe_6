<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilføj ønske til din ønskeseddel</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h2><a th:href="@{/}" class="logo">Ønskeskyen ☁️</a></h2>

    <nav>
        <a th:href="@{/wishlists}">Mine ønskesedler</a>
    </nav>
</header>

<main>
    <h1 class="addWishHeading">
        Tilføj et ønske til
        <span th:if="${wishlist != null}" th:text="${wishlist.title}">ønskesedlen</span> 🎁
    </h1>

    <div th:if="${errorMessage != null}" class="error-message" th:text="${errorMessage}">
        Fejl
    </div>

    <div class="createwish-formular">
        <form th:action="@{/saveCreateWish}" method="post" th:object="${wish}">
            <input type="hidden" name="wishlistId" th:value="${wishlistId}">

            <label for="name">Navn på ønske</label>
            <input type="text" id="name" th:field="*{name}" required>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            <br>

            <label for="description">Beskrivelse</label>
            <input type="text" id="description" th:field="*{description}">
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            <br>

            <label for="quantity">Antal</label>
            <input type="number" id="quantity" th:field="*{quantity}">
            <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            <br>

            <label for="price">Pris</label>
            <input type="text" id="price" th:field="*{price}">
            <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            <br>

            <label for="productUrl">Link til ønske</label>
            <input type="url" id="productUrl" th:field="*{productUrl}">
            <div th:if="${#fields.hasErrors('productUrl')}" th:errors="*{productUrl}"></div>
            <br>

            <label for="imageUrl">Link til billede af ønske</label>
            <input type="url" id="imageUrl" th:field="*{imageUrl}">
            <div th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
            <br>

            <button type="submit" class="createButton">Gem ønske</button>

        </form>
    </div>
</main>

<footer>
    <p>ØNSKESKYEN · 2026 </p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mine ønskesedler</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h2><a th:href="@{/}" class="logo">Ønskeskyen ☁️</a></h2>
    <nav>
        <a th:href="@{/getCreateWishList}">Opret ønskeseddel</a>
    </nav>
</header>

<main>

    <h1 class="overskriftWishlist">Mine ønskesedler</h1>
    <p class="textWishLists">Her kan du se dine ønskesedler og åbne dem.</p>

    <div th:if="${#lists.isEmpty(wishlists)}">
        <p>Du har endnu ingen ønskesedler.</p>
    </div>


    <div class="wishlist-container"
         th:unless="${#lists.isEmpty(wishlists)}">

        <div class="wishlist-box"
             th:each="wishlist : ${wishlists}">

            <h2 th:text="${wishlist.title}">Titel</h2>

            <a th:href="@{/showWishList(id=${wishlist.id})}">
                Se ønskeseddel
            </a>

        </div>

    </div>

    <div class="button4">
        <form th:action="@{/getCreateWishList}" method="get" class="modify-form">
            <button class="btn">+ Opret en ny ønskeseddel</button>
        </form>
    </div>
</main>

</body>
</html>

name: Maven build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 21 build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Opsæt Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Byg projekt
        run: bash mvnw --batch-mode --no-transfer-progress package
